[run]
branch = True
source = backend
data_file = docs/testing/2026-10-12-backend.coverage
omit =
    */.venv/*
    */tests/*
    */output/*
    */uploads/*
    */__pycache__/*
    */node_modules/*
    */research/test_*.py

[report]
include_namespace_packages = True
# No default pragma exclusions or partial-branch exemptions.
exclude_lines =
partial_branches =
show_missing = True

[json]
output = docs/testing/2026-10-12-backend-coverage.json
