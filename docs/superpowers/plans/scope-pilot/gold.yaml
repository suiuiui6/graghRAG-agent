      - {id: F3, label: 问题二全年吨氨成本分布, value: "3", unit: 图号, condition: 各产量箱线图及排序曲线, role: figure, anchor: "图 3— 问题二全年吨氨成本分布（左：各产量箱线图；右：排序分布曲线）"}
      - {id: F4, label: 问题三离散与连续对比, value: "4", unit: 图号, condition: 成本分布及绿电指标, role: figure, anchor: "图 4— 问题三离散 vs连续对比（左：全年成本分布曲线；右：绿电指标雷达图）"}
      - {id: F5, label: 问题四离网与储能分析, value: "5", unit: 图号, condition: 三模式经济性及充放电调度, role: figure, anchor: "图 5— 问题四离网与储能分析（左：三种模式经济性对比；右：储能充放电调度）"}
      - {id: F6, label: 全问题综合汇总, value: "6", unit: 图号, condition: 四合一, role: figure, anchor: "图 6— 全问题综合汇总图（四合一：成本对比/指标雷达/成本分布/产量对比）"}
