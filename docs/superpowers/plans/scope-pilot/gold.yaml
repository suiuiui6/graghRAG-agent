  - id: D1-COST
    historical_qid: Q16
    doc: D1
    query: 论文摘要中提到的吨氨成本类经济指标分别有哪些？列数值、单位及对应条件。
    scope: {kind: section, start: "## 摘 要", end: "关键词："}
    items:
      - {id: C1, label: 吨氨成本, value: "3554", unit: 元/吨, condition: 问题一满负荷连续运行基准, role: result, anchor: "问题一建立了满负荷连续运行基准线模型，计算表明典型日总用电量558.72MWh，新能源发电量 603.45MWh，网购电量 172.04MWh，上网电量 216.77MWh；吨氨成本3554元/吨。"}
      - {id: C2, label: 全年吨氨成本, value: "5820", unit: 元/吨, condition: 问题二离散调节全年, role: result, anchor: "全年吨氨成本 5820元/吨"}
      - {id: C3, label: 高产量档吨氨成本, value: "7111", unit: 元/吨, condition: 问题二72吨每日离散, role: result, anchor: "72吨/日，18/24场景全满足，7111元/吨"}
      - {id: C4, label: 低产量档吨氨成本, value: "3669", unit: 元/吨, condition: 问题二36吨每日离散, role: result, anchor: "36吨/日，0/24场景全满足，3669元/吨"}
      - {id: C5, label: 全年吨氨成本, value: "5652", unit: 元/吨, condition: 问题三连续可调全年, role: result, anchor: "相比离散制氨，全年吨氨成本降至 5652元/吨（降低2.9%）"}
    disallowed: [168元每吨作为摘要成本, 3682或3749作为摘要成本, 3554绑定问题二36吨每日]
  - id: D1-LIMITS
