      - {id: L2, label: 场景覆盖度有限, value: null, unit: null, condition: 当前模型, role: limitation, anchor: "(2) 场景覆盖度有限。"}
      - {id: L3, label: 未纳入碳交易收益, value: null, unit: null, condition: 当前成本计算, role: limitation, anchor: "(3) 未纳入碳交易收益。"}
      - {id: L4, label: 确定性模型未处理预测不确定性, value: null, unit: null, condition: 当前模型, role: limitation, anchor: "(4) 确定性模型未处理预测不确定性。"}
