- id: D1-COST-v2
  original_qid: D1-COST
  historical_qid: Q16
  doc: D1
  query_version: '2.0'
  query: 仅根据摘要，列出直接报告的吨氨成本水平（单位元/吨）及对应问题、运行模式和产量或全年条件；不单独计入相对降幅或电网支撑价值。
  scope:
    type: section
    start: 55
    end: 1097
    complete_original_interval: true
    text_sha256: f929551785359718d9084a72ecfef1149af8765589ccb2c891c026ac8660e7b1
    start_marker: '## 摘 要'
    end_marker_excluded: 关键词：
    materialization: Read original source locally, normalize universal newlines to LF, then text[start:end].
    exact_text: '## 摘 要


      （0.75MW/1.5t/h）及峰值6MW的常规电负荷，初始产能 36吨氨/日，扩容后达72吨氨日。研究构建了从满负荷基准线到离散/连续优化调度、从并网运行到离网储能配置、从单园区分析到系统级政策建议的完整建模框架。


      问题一建立了满负荷连续运行基准线模型，计算表明典型日总用电量558.72MWh，新能源发电量 603.45MWh，网购电量 172.04MWh，上网电量 216.77MWh；吨氨成本3554元/吨。三项绿电直连指标中，新能源自发自用率28.2%（不满足>60%要求）和上网电量比例35.9%（不满足<20%要求）两项不合格，根源在于满负荷运行缺乏灵活性。


      问题二针对产能 72吨/日、设备仅支持全开/全关的离散调节场景，构建了混合整数线性规划（MILP）模型，引入0-1启停变量和购售电互斥大M法约束。对5种产量×24种风光场景共120个子问题求解，全年吨氨成本 5820元/吨，绿电指标全满足率仅39.2%。高产量档指标达标率优但经济性差（72吨/日，18/24场景全满足，7111元/吨），低产量档反之（36吨/日，0/24场景全满足，3669元/吨），揭示了绿电合规与经济效益之间的根本矛盾。


      问题三将设备功率扩展为 10%\~100%连续可调，引入氢平衡约束将电功率与物质流耦合，模型退化为线性规划（LP）。相比离散制氨，全年吨氨成本降至 5652元/吨（降低2.9%），网购电量减少11.2%，上网电量减少36.9%，绿电指标全满足率从39.2%跃升至69.2%（+30个百分点）。连续功率调节使设备可"如影随形"式贴合风光出力曲线，是提升绿电指标和经济性的关键技术路径。


      问题四研究了离网运行与储能双层优化。离网无储能下全年制氨仅9023吨（联网的9.3%），风光利用率95.4%。针对最大弃电场景W4S1（弃电量173.7MWh/日），外层枚举60组储能配置、内层 LP求解，得到最优配置 210.4MWh/30MW，加储能后产量提升至10903吨（+20.8%），风光利用率达100%。电网支撑价值为1970元/吨，量化了电网功率支撑对园区规模化生产的不可替代作用。


      问题五从新能源消纳、输配电损耗、辅助服务三方面分析了绿电园区大规模渗透的利好，从系统惯量下降、负荷海啸效应、鸭子曲线加剧三方面分析了不利影响，提出了碳资


      产交易、友好互动电价、区域氨交易市场、储能配置标准四项政策建议，均基于前述定量结果给出论证依据。


      '
