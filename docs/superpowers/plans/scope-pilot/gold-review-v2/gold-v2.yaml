adjudication:
  mode: manual_semantic_adjudication_only
  automatic_checks: Exact slice, source/scope hash and structural checks verify package binding only; they cannot score semantic
    correctness.
  dimensions:
    content: Expected item membership, atomic value/unit/condition/provenance/role and completeness; report per-question exact
      set and per-attribute decisions separately.
    support: The actual provided input must entail each answered attribute. Document factual correctness and request-input
      support are separate records; correct memory cannot replace input evidence.
    scope: Record COMPLETE, PARTIAL, MISSING or OUTSIDE for actual context coverage. Use coverage_adjudication_target when
      present, otherwise scope. D1-FUTURE requires only the complete item (4); the remaining three limitations are optional
      reading context. Complete question-specific target is required for completeness and absence claims.
    citation: Check cited source identity, locator, scope inclusion and semantic entailment for each claim; a present but
      irrelevant anchor is not a valid citation. Citation-free factual correctness does not satisfy a citation contract.
    negative: D2-NONE succeeds only as scope-specific no-optimizer-name statement with complete-scope support; empty retrieval
      means insufficient evidence.
    role: Do not relabel proposed methods or specified architecture functions as implemented results.
    extras: Report out-of-set assertions separately and distinguish source-supported historical context from fabricated or
      scope-external claims; C6/C7 are not unsupported merely because excluded from new membership.
  decision_values:
  - PASS
  - FAIL
  - INSUFFICIENT_EVIDENCE
  - NOT_APPLICABLE
  aggregation: No automatic accuracy or aggregate metric is emitted by this package. Do not mix rewritten v2 questions with
    old 27 answers or change old denominators. Human judges must preserve disagreement and rationale.
  per_attribute_record:
  - qid
  - item_id
  - attribute_key
  - actual_claim
  - content_decision
  - support_decision
  - scope_decision
  - citation_decision
  - evidence_class
  - rationale
  inference_rule: Explicit text, inferred provenance, and absence are distinct labels; a semantic inference never becomes
    explicit by repetition.
  unit_rules: Preserve about and original source units; quantity-equivalent normalizations may be accepted by human judgment.
    Do not silently convert 36M sentences to sentence pairs.
  compatibility: 'Existing pilot.py is not v2 compatible: new IDs, whole-document FIG scope, numeric source spans, attribute
    lists and absence contracts require an approved adapter before any future run.'
  future_assembler_requirement: 'Not implemented by this package: whole-document scan or a source-supported caption inventory
    projection with complete-scan coverage proof; the legacy six-appendix projection alone cannot establish all-document completeness.
    Budget-limited or otherwise partial inputs must be recorded as PARTIAL, never strictly complete.'
  source_vs_provider_coverage: The full local FIG oracle interval [0,22366) does not establish complete provider-visible evidence.
    A future assembler must record actual source spans and context-budget coverage independently.
  required_vs_optional: Required attributes follow the approved question. Optional source-supported details never lower required
    completeness when omitted, but their asserted errors are recorded as contradictions. Internal enums and field keys need
    not be printed by an answer.
  figure_title_alias_rule: Every recorded body title and its Appendix B alias may satisfy required title, including F6. Optional
    panel diagnostics do not create mandatory detail beyond the accepted alias. Any explicit F2 production claim contradicting
    36吨/日 is rejected.
  semantic_role_rule: Evaluate proposed/specification/current-result roles semantically; do not require literal internal enum
    strings.
  coverage_target_selection: 'Required algorithm: target = question.coverage_adjudication_target if present else question.scope.
    Compare actual mapped input coverage against that target, not against an optional wider context scope.'
