  - 不把候选研究空白表述为已证明事实
  - 不把不同语料、预算或指标下的数值直接横向比较
acceptance_checks:
  - 每篇入选文献的题名、作者、年份、载体和 DOI/arXiv ID 均已核验
  - 至少覆盖 GraphRAG、长文档 RAG、grounded/citation、adaptive/cost-aware RAG 和 RAG evaluation
  - 能明确本项目相对哪类方法改进以及不能声称什么
  - 交付完整 expert contract 1.0
