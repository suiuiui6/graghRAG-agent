plan_version: 1.1
status: BOUNDED_TEXT_PILOT_PASS_DEVELOPMENT_GOLD_V1
activation_gate:
  data_sufficiency: INSUFFICIENT
  critical_gap: 现有8份同域企业安全材料可启动开发，但缺许可可核验的公开制造技术手册及跨结构开发材料；文件数量本身不是不足判据。
  cleaning_or_derivation_can_repair: false
