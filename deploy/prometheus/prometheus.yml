# Prometheus Configuration — GraphRAG
# enterprise-evolution-blueprint-v1.0 §6.4

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "graphrag-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    scrape_interval: 15s
    scrape_timeout: 10s
