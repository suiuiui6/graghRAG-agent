# AlertManager Configuration — GraphRAG
# enterprise-evolution-blueprint-v1.0 §6.8
#
# Routes alerts to Feishu bot webhook + optional email.

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "feishu-webhook"
  routes:
    - match:
        severity: critical
      receiver: "feishu-webhook"
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: "feishu-webhook"
      repeat_interval: 1h

receivers:
  - name: "feishu-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:8000/api/v1/bot/feishu/alert"
        send_resolved: true
        http_config:
          follow_redirects: true

  - name: "email-daily"
    email_configs:
      - to: "ops@company.com"
        from: "graphrag-alerts@company.com"
        smarthost: "smtp.company.com:587"
        require_tls: true
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
