<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多模态 RAG 知识图谱问答系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.js"></script>
<style>
:root {
  --bg-root: #0b1120; --bg-card: #111827; --bg-elevated: #1e293b;
  --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
  --accent: #3b82f6; --accent-light: #60a5fa; --accent-bg: rgba(59,130,246,.1);
  --green: #22c55e; --yellow: #eab308; --red: #ef4444; --purple: #a855f7;
  --teal: #14b8a6; --orange: #f97316; --pink: #ec4899;
  --border: #1e293b; --radius: 10px; --radius-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-root); color: var(--text); display:flex; height:100vh; overflow:hidden; font-size:14px; line-height:1.5; }

/* === SIDEBAR === */
.sidebar { width:240px; min-width:240px; background: var(--bg-card); border-right:1px solid var(--border); display:flex; flex-direction:column; z-index:10; }
.sidebar-header { padding:20px; border-bottom:1px solid var(--border); }
.sidebar-header .brand { display:flex; align-items:center; gap:10px; }
.sidebar-header .brand-logo { width:38px; height:38px; background:linear-gradient(135deg,var(--accent),#6366f1); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; color:white; }
.sidebar-header h2 { font-size:15px; font-weight:700; letter-spacing:-0.3px; }
.sidebar-header .sub { font-size:10px; color:var(--text3); margin-top:2px; text-transform:uppercase; letter-spacing:0.5px; }
.sidebar-nav { padding:12px; flex:1; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; cursor:pointer; color:var(--text2); font-size:13px; font-weight:500; margin-bottom:2px; transition:all .15s; position:relative; }
.nav-item:hover { background:rgba(255,255,255,.03); color:var(--text); }
.nav-item.active { background:var(--accent-bg); color:var(--accent); }
.nav-item .icon { font-size:17px; width:22px; text-align:center; }
.nav-item .badge { margin-left:auto; background:var(--accent-bg); color:var(--accent); font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
.sidebar-footer { padding:14px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--text3); }
.sidebar-footer .stat { display:flex; justify-content:space-between; padding:3px 0; }
.sidebar-footer .stat-val { color:var(--text2); font-weight:600; }

/* === MAIN === */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.topbar { height:52px; padding:0 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--bg-root); flex-shrink:0; }
.topbar .bc { font-size:12px; color:var(--text3); }
.topbar .bc span { color:var(--text); font-weight:500; }
.topbar .status-dots { display:flex; gap:12px; font-size:11px; color:var(--text3); }
.topbar .status-dots .dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:4px; }
.topbar .status-dots .dot.green { background:var(--green); }
.content { flex:1; overflow-y:auto; }

/* === COMMON === */
.section-title { font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.btn { padding:8px 18px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary { background:var(--accent); color:white; }
.btn-primary:hover { background:var(--accent-light); transform:translateY(-1px); box-shadow:0 4px 12px rgba(59,130,246,.3); }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text2); }
.btn-outline:hover { border-color:var(--accent); color:var(--accent); }
.btn-ghost { background:transparent; color:var(--text2); padding:6px 12px; font-size:12px; }
.btn-ghost:hover { color:var(--text); }
.btn-sm { padding:5px 12px; font-size:11px; border-radius:6px; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:600; }
.badge-green { background:rgba(34,197,94,.1); color:var(--green); }
.badge-blue { background:rgba(59,130,246,.1); color:var(--accent); }
.badge-yellow { background:rgba(234,179,8,.1); color:var(--yellow); }
.badge-red { background:rgba(239,68,68,.1); color:var(--red); }
.badge-purple { background:rgba(168,85,247,.1); color:var(--purple); }

/* === CARDS === */
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); }
.card-header { padding:16px 20px; border-bottom:1px solid var(--border); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:space-between; }
.card-body { padding:20px; }

/* === PAGE: UPLOAD === */
.upload-page { max-width:900px; margin:0 auto; padding:32px 24px; }
.upload-hero { text-align:center; margin-bottom:32px; }
.upload-hero h1 { font-size:28px; font-weight:800; letter-spacing:-0.5px; margin-bottom:8px; background:linear-gradient(135deg,var(--text),var(--accent-light)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.upload-hero p { color:var(--text3); font-size:14px; max-width:500px; margin:0 auto; }
.upload-dropzone { border:2px dashed var(--border); border-radius:16px; padding:56px; text-align:center; cursor:pointer; transition:all .3s; background:rgba(59,130,246,.01); position:relative; overflow:hidden; }
.upload-dropzone::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(59,130,246,.05) 0%, transparent 70%); opacity:0; transition:opacity .3s; }
.upload-dropzone:hover { border-color:var(--accent); }
.upload-dropzone:hover::before { opacity:1; }
.upload-dropzone .dz-icon { width:64px; height:64px; margin:0 auto 16px; background:rgba(59,130,246,.08); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; }
.upload-dropzone h3 { font-size:17px; margin-bottom:4px; }
.upload-dropzone p { color:var(--text3); font-size:13px; }
.upload-dropzone .formats { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
.upload-dropzone .formats span { font-size:10px; padding:3px 10px; background:var(--bg-elevated); border-radius:6px; color:var(--text3); font-weight:500; letter-spacing:0.3px; }
.config-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.config-item { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); }
.config-item .ci-left { display:flex; align-items:center; gap:10px; }
.config-item .ci-icon { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--bg-elevated); }
.config-item .ci-label { font-size:13px; font-weight:500; }
.config-item .ci-desc { font-size:11px; color:var(--text3); margin-top:1px; }
.toggle-switch { width:44px; height:24px; background:var(--border); border-radius:12px; position:relative; cursor:pointer; transition:.2s; flex-shrink:0; }
.toggle-switch.on { background:var(--accent); }
.toggle-switch::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; background:white; border-radius:50%; transition:.2s; }
.toggle-switch.on::after { left:22px; }

/* === PIPELINE === */
.pipeline-viz { display:flex; gap:0; align-items:flex-start; margin-top:24px; }
.pl-step { flex:1; text-align:center; position:relative; }
.pl-step::after { content:''; position:absolute; top:14px; left:calc(50% + 16px); width:calc(100% - 32px); height:2px; background:var(--border); }
.pl-step:last-child::after { display:none; }
.pl-step .pl-dot { width:28px; height:28px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; background:var(--border); color:var(--text3); }
.pl-step.done .pl-dot { background:var(--green); color:white; }
.pl-step.running .pl-dot { background:var(--accent); color:white; animation:pl-pulse 2s infinite; }
.pl-step.done::after { background:var(--green); }
.pl-step .pl-name { font-size:11px; font-weight:600; margin-bottom:2px; }
.pl-step .pl-time { font-size:10px; color:var(--text3); }
@keyframes pl-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4)} 50%{box-shadow:0 0 0 10px rgba(59,130,246,0)} }

/* === STATS === */
.stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:24px; }
.stat-box { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.stat-box .sb-val { font-size:30px; font-weight:800; letter-spacing:-1px; }
.stat-box .sb-lbl { font-size:11px; color:var(--text3); margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
.stat-box .sb-sub { font-size:10px; color:var(--text3); margin-top:8px; }

/* === PAGE: DOCUMENTS === */
.docs-page { padding:32px 24px; }
.doc-table { width:100%; border-collapse:collapse; }
.doc-table th { text-align:left; padding:10px 16px; font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--border); }
.doc-table td { padding:14px 16px; font-size:13px; border-bottom:1px solid rgba(30,41,59,.5); vertical-align:middle; }
.doc-table tr { transition:.1s; }
.doc-table tr:hover td { background:rgba(59,130,246,.02); }
.doc-icon { width:36px; height:36px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; margin-right:10px; background:var(--bg-elevated); vertical-align:middle; }
.doc-name { vertical-align:middle; }

/* === PAGE: QUERY === */
.query-page { display:flex; height:calc(100vh - 52px); }
.query-chat { width:45%; min-width:400px; display:flex; flex-direction:column; border-right:1px solid var(--border); }
.query-chat-header { padding:14px 20px; border-bottom:1px solid var(--border); font-weight:600; font-size:13px; display:flex; align-items:center; gap:8px; }
.query-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
.msg { max-width:88%; }
.msg.user { align-self:flex-end; }
.msg.agent { align-self:flex-start; }
.msg .bubble { padding:12px 16px; border-radius:14px; font-size:13px; line-height:1.6; }
.msg.user .bubble { background:var(--accent); color:white; border-bottom-right-radius:4px; }
.msg.agent .bubble { background:var(--bg-elevated); border-bottom-left-radius:4px; }
.msg.agent .bubble table { margin:8px 0; font-size:12px; }
.msg.agent .bubble th { background:rgba(255,255,255,.04); padding:6px 10px; font-size:11px; }
.msg.agent .bubble td { padding:6px 10px; border-bottom:1px solid var(--border); font-size:12px; }
.msg .src-chips { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
.query-input-bar { padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; }
.query-input-bar textarea { flex:1; background:var(--bg-elevated); border:1px solid var(--border); border-radius:20px; padding:10px 18px; color:var(--text); font-size:13px; resize:none; font-family:inherit; min-height:42px; max-height:100px; }
.query-input-bar textarea:focus { outline:none; border-color:var(--accent); }
.query-input-bar .send-btn { width:42px; height:42px; border-radius:50%; background:var(--accent); color:white; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }

.query-detail { flex:1; overflow-y:auto; padding:24px; }
.detail-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
.detail-card .dc-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.detail-card .dc-prop { display:flex; justify-content:space-between; padding:7px 0; font-size:12px; border-bottom:1px solid rgba(30,41,59,.5); }
.detail-card .dc-key { color:var(--text3); }
.detail-card .dc-val { color:var(--text); font-weight:500; }
.entity-type-tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; }
.ett-blue { background:rgba(59,130,246,.1); color:var(--accent); }
.ett-green { background:rgba(34,197,94,.1); color:var(--green); }
.ett-yellow { background:rgba(234,179,8,.1); color:var(--yellow); }
.ett-purple { background:rgba(168,85,247,.1); color:var(--purple); }

/* === PAGE: GRAPH === */
.graph-page { height:calc(100vh - 52px); position:relative; background:var(--bg-root); }
#graphCanvas { width:100%; height:100%; }
.graph-overlay { position:absolute; top:16px; left:16px; z-index:2; }
.graph-controls { display:flex; gap:6px; margin-bottom:8px; }
.graph-ctrl-btn { padding:8px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:20px; color:var(--text2); font-size:11px; font-weight:600; cursor:pointer; transition:.15s; }
.graph-ctrl-btn:hover { border-color:var(--accent); color:var(--text); }
.graph-ctrl-btn.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }
.graph-legend { position:absolute; top:16px; right:16px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; z-index:2; max-height:calc(100% - 100px); overflow-y:auto; }
.graph-legend .gl-title { font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.graph-legend .gl-item { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:11px; cursor:pointer; transition:.15s; }
.graph-legend .gl-item:hover { opacity:.8; }
.graph-legend .gl-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.graph-legend .gl-count { margin-left:auto; font-size:10px; color:var(--text3); }

/* === EMPTY STATE === */
.empty-state { text-align:center; padding:60px 20px; }
.empty-state .es-icon { width:80px; height:80px; margin:0 auto 20px; background:var(--bg-elevated); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:36px; }
.empty-state h3 { font-size:18px; margin-bottom:6px; }
.empty-state p { color:var(--text3); font-size:13px; max-width:400px; margin:0 auto 20px; }

/* === RESPONSIVE === */
@media (max-width:768px) {
  .sidebar { display:none; }
  .query-page { flex-direction:column; }
  .query-chat { width:100%; min-width:0; height:50%; }
  .stat-row { grid-template-columns:repeat(2,1fr); }
  .config-grid { grid-template-columns:1fr; }
  .graph-legend { display:none; }
}

/* Scrollbar */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div>
        <h2>RAG 知识图谱</h2>
        <div class="sub">Multi-Modal QA System</div>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-page="upload">
      <span class="icon">📤</span> 上传文档
    </div>
    <div class="nav-item" data-page="docs">
      <span class="icon">📚</span> 文档管理
      <span class="badge">1</span>
    </div>
    <div class="nav-item" data-page="query">
      <span class="icon">💬</span> 知识问答
    </div>
    <div class="nav-item" data-page="graph">
      <span class="icon">🔮</span> 图谱可视化
      <span class="badge">310</span>
    </div>
    <div class="nav-item" data-page="health">
      <span class="icon">📊</span> 系统状态
    </div>
  </nav>
  <div class="sidebar-footer">
    <div class="stat"><span>已索引文档</span><span class="stat-val">1</span></div>
    <div class="stat"><span>图谱节点</span><span class="stat-val">310</span></div>
    <div class="stat"><span>图谱关系</span><span class="stat-val">1,529</span></div>
    <div class="stat"><span>今日查询</span><span class="stat-val">5</span></div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="bc">系统 / <span id="pageTitle">上传文档</span></div>
    <div class="status-dots">
      <span><span class="dot green"></span> MinerU API</span>
      <span><span class="dot green"></span> DeepSeek</span>
      <span><span class="dot green"></span> KG Store</span>
    </div>
  </div>
  <div class="content" id="appContent"></div>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const TYPE_COLORS = {
  paper_metadata:'#3b82f6', section_header:'#22c55e', model_component:'#a855f7',
  metric:'#eab308', dataset:'#f97316', method:'#ec4899',
  definition:'#8b5cf6', equation:'#14b8a6', reference:'#94a3b8', claim:'#ef4444'
};
const TYPE_ICONS = {
  paper_metadata:'📋', section_header:'📑', model_component:'🧩',
  metric:'📊', dataset:'💾', method:'🔧', definition:'📖',
  equation:'∑', reference:'📎', claim:'💡'
};
const ENTITY_TYPES = [
  {t:'reference',c:76},{t:'claim',c:48},{t:'model_component',c:40},
  {t:'metric',c:35},{t:'paper_metadata',c:31},{t:'method',c:23},
  {t:'section_header',c:18},{t:'equation',c:16},{t:'definition',c:13},{t:'dataset',c:10}
];

// ============================================================
// ROUTER
// ============================================================
const pages = { upload, docs, query, graph, health };
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', function() {
    if (this.classList.contains('active')) return;
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('pageTitle').textContent = this.textContent.trim();
    pages[this.dataset.page]();
  });
});

// ============================================================
// PAGE: UPLOAD
// ============================================================
function upload() {
  document.getElementById('appContent').innerHTML = `
    <div class="upload-page">
      <div class="upload-hero">
        <h1>上传文档，构建知识图谱</h1>
        <p>支持 11 种格式 · 自动解析 · 实体抽取 · 知识图谱构建 · 自然语言问答</p>
      </div>
      <div class="upload-dropzone" id="dropZone" onclick="simulateUpload()">
        <div class="dz-icon">📁</div>
        <h3>拖拽文件到此处，或点击选择文件</h3>
        <p>单个文件最大 200MB · 最多 600 页</p>
        <div class="formats">
          <span>PDF</span><span>DOCX</span><span>PPTX</span><span>XLSX</span>
          <span>PNG</span><span>JPG</span><span>EPUB</span><span>HTML</span>
        </div>
      </div>
      <div style="margin-top:24px;">
        <div class="section-title">解析配置</div>
        <div class="config-grid">
          <div class="config-item">
            <div class="ci-left">
              <div class="ci-icon">🌐</div>
              <div><div class="ci-label">文档语言</div><div class="ci-desc">选择文档主要语言</div></div>
            </div>
            <select style="background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12px;">
              <option>中文</option><option>English</option><option>日本語</option>
            </select>
          </div>
          <div class="config-item">
            <div class="ci-left">
              <div class="ci-icon">🔍</div>
              <div><div class="ci-label">OCR 扫描件识别</div><div class="ci-desc">图片型 PDF 需开启</div></div>
            </div>
            <div class="toggle-switch" onclick="this.classList.toggle('on')"></div>
          </div>
          <div class="config-item">
            <div class="ci-left">
              <div class="ci-icon">📐</div>
              <div><div class="ci-label">公式识别</div><div class="ci-desc">LaTeX 数学公式提取</div></div>
            </div>
            <div class="toggle-switch on" onclick="this.classList.toggle('on')"></div>
          </div>
          <div class="config-item">
            <div class="ci-left">
              <div class="ci-icon">📊</div>
              <div><div class="ci-label">表格识别</div><div class="ci-desc">HTML 表格结构化</div></div>
            </div>
            <div class="toggle-switch on" onclick="this.classList.toggle('on')"></div>
          </div>
        </div>
        <div style="text-align:center;margin-top:28px;">
          <button class="btn btn-primary" style="padding:14px 56px;font-size:15px;border-radius:28px;" onclick="startPipeline()">
            🚀 开始解析文档
          </button>
        </div>
      </div>
      <div id="pipelineSection"></div>
      <div id="resultSection"></div>
    </div>
  `;
}

function simulateUpload() {
  const dz = document.getElementById('dropZone');
  dz.innerHTML = `
    <div class="dz-icon">📄</div>
    <h3>Attention Is All You Need.pdf</h3>
    <p>2.0 MB · 15 页 · PDF</p>
    <div class="formats"><span style="background:rgba(34,197,94,.1);color:var(--green);">✓ 文件就绪</span></div>
  `;
}

function startPipeline() {
  const ps = document.getElementById('pipelineSection');
  ps.innerHTML = `

// ============================================================
// GRAPH ENGINE
// ============================================================
let graphNetwork, graphNodes, graphEdges;
const GRAPH_SAMPLE = (() => {
  const ns = [];
  const types = Object.keys(TYPE_COLORS);
  for (let i=0;i<80;i++) {
    const t = types[i%10];
    ns.push({id:`n${String(i+1).padStart(4,'0')}`, entity_type:t, label:`${t} entity ${i+1}`, grounded:i<55, page_idx:Math.floor(i/6)});
  }
  const es = [];
  for (let i=0;i<200;i++) {
    es.push({id:`e${i+1}`, from:`n${String(Math.floor(Math.random()*80)+1).padStart(4,'0')}`, to:`n${String(Math.floor(Math.random()*80)+1).padStart(4,'0')}`});
  }
  return {nodes:ns, edges:es};
})();

function initGraph() {
  const c = document.getElementById('graphCanvas');
  if (!c) return;
  const visNodes = GRAPH_SAMPLE.nodes.map(n => ({
    id:n.id, label:'',
    color:{background:TYPE_COLORS[n.entity_type], border:n.grounded?'#fff':'#ef4444', highlight:{background:TYPE_COLORS[n.entity_type], border:'#fff'}},
    size:n.grounded?10:6, borderWidth:n.grounded?1.5:1,
    entity_type:n.entity_type, grounded:n.grounded
  }));
  const visEdges = GRAPH_SAMPLE.edges.map(e => ({
    id:e.id, from:e.from, to:e.to, color:{color:'rgba(148,163,184,.15)'}, width:0.5,
  }));
  graphNetwork = new vis.Network(c, {nodes:new vis.DataSet(visNodes), edges:new vis.DataSet(visEdges)}, {
    physics:{solver:'forceAtlas2Based', forceAtlas2Based:{gravitationalConstant:-35,centralGravity:0.005,springLength:80,springConstant:0.03}},
    interaction:{hover:true, zoomView:true, dragView:true},
    nodes:{shape:'dot'},
  });
}
function resetGraph() { if(graphNetwork) graphNetwork.fit({animation:{duration:500}}); }
function togglePhysics() {
  if(!graphNetwork) return;
  graphNetwork.setOptions({physics:{enabled:!graphNetwork.physics.options.enabled}});
  document.getElementById('physBtn').classList.toggle('on');
}
function toggleGrounded() {
  if(!graphNetwork) return;
  document.getElementById('groundedBtn').classList.toggle('on');
}
function filterGraphType(t) { /* highlight nodes of this type */ }
